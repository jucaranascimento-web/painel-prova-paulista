<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carregar dados</title></head><body style="font:16px system-ui;max-width:560px;margin:40px auto;padding:0 16px">
<h2>Carregar dados do painel</h2><p id="m">Digite a senha do administrador.</p>
<p><input id="p" type="password" placeholder="Senha do administrador"> <button id="b">Entrar</button></p>
<p><input type="file" id="f" accept=".json" hidden> <button id="s" hidden>Enviar dados.json</button></p>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import{getFirestore,doc,setDoc}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDqJIp4ssjydTdjsXrDEBPheriFHxY3A7g",authDomain:"julio-fortes-prova-paulista.firebaseapp.com",projectId:"julio-fortes-prova-paulista",storageBucket:"julio-fortes-prova-paulista.firebasestorage.app",messagingSenderId:"1063763539969",appId:"1:1063763539969:web:49c846ae1736aad7f9a800"}),auth=getAuth(app),db=getFirestore(app),$=i=>document.getElementById(i);
$('b').onclick=()=>signInWithEmailAndPassword(auth,'admin@juliofortes.app',$('p').value).catch(()=>{$('m').textContent='Senha incorreta.'});
onAuthStateChanged(auth,u=>{if(u&&u.email!='admin@juliofortes.app'){signOut(auth);return}if(u){$('p').hidden=1;$('b').hidden=1;$('f').hidden=0;$('s').hidden=0;$('m').textContent='Conectado. Escolha o arquivo dados.json e envie.'}});
$('s').onclick=async()=>{const x=$('f').files[0];if(!x){$('m').textContent='Escolha o arquivo primeiro.';return}
try{const j=await x.text();JSON.parse(j);await setDoc(doc(db,'painel','dados'),{json:j,em:new Date().toISOString()});$('m').textContent='Dados enviados com sucesso.'}catch(e){$('m').textContent='Erro: '+(e.code||e.message)}};
</script></body></html>
